# FILE: render.yaml
# [ROLE: DEVOPS ENGINEER]
# Decision: Render deploys from a Git-backed Blueprint, so the service contract keeps
# build, start, health check, and secret environment variables in one auditable file.
services:
  - type: web
    name: wa-ai-assistant
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm prisma generate && pnpm prisma migrate deploy && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: WHATSAPP_APP_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        sync: false
      - key: WHATSAPP_MOCK_MODE
        sync: false
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_CARD_INTEGRATION_ID
        sync: false
      - key: PAYMOB_CURRENCY
        sync: false
      - key: PAYMOB_PRO_AMOUNT_CENTS
        sync: false
      - key: PAYMOB_BUSINESS_AMOUNT_CENTS
        sync: false
      - key: PAYMOB_IFRAME_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_EMAIL_REDIRECT_URL
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: NEXT_PUBLIC_META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: GA_MEASUREMENT_ID
